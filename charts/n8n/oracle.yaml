apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n
  namespace: n8n
  labels:
    helm.sh/chart: n8n-1.9.0
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
